/* ── Realistic Isometric Office Rendering ── */
function drawIsometricScene(f, fc){
  const fImg=floorImgs[curFloor%floorImgs.length];
  if(!fImg||!fImg.complete||!fImg.naturalWidth)return false;

  const imgRatio=fImg.naturalWidth/fImg.naturalHeight;
  const cRatio=W/H;
  let baseW,baseH;
  if(cRatio>imgRatio){
    // Constrained by height: fit entire vertical office height H, center horizontally
    baseH=H;
    baseW=H*imgRatio;
  }else{
    // Constrained by width: fit entire horizontal office width W, center vertically
    baseW=W;
    baseH=W/imgRatio;
  }

  const dw=baseW*zoomScale;
  const dh=baseH*zoomScale;
  const dx=(W-dw)/2+panX;
  const dy=(H-dh)/2+panY;

  // Draw base backdrop
  X.drawImage(fImg,dx,dy,dw,dh);

  // Subtle ambient breathing shadow
  const pulse=0.03+Math.sin(fc*0.025)*0.015;
  X.fillStyle=`rgba(6,5,4,${0.12+pulse})`;
  X.fillRect(0,0,W,H);

  // Department / Equipment Callout Tags
  drawRoomHudTags(curFloor,dx,dy,dw,dh,fc);

  // Update animated isometric agent simulation
  updateIsometricAgents(f, fc);

  // Map and render agents on realistic isometric floor
  drawIsometricWorkerNodes(f,dx,dy,dw,dh,fc);

  return true;
}

function drawRoomHudTags(floorIdx,dx,dy,dw,dh,frame){
  const g=(liveData&&liveData.gpu)||{};
  const p=(liveData&&liveData.procs)||{};
  const blink=Math.sin(frame*0.08)>0;

  function tag(rx,ry,label,color='#f0a030',sub=''){
    const px=dx+dw*rx,py=dy+dh*ry;
    X.font='bold 11px "Courier New",monospace';
    const lW=X.measureText(label).width;
    X.font='9px "Courier New",monospace';
    const sW=sub?X.measureText(sub).width:0;
    const tw=Math.max(lW,sW)+32;
    const th=sub?28:18;
    X.fillStyle='rgba(8,7,6,0.92)';
    X.beginPath();X.roundRect(px-tw/2,py-10,tw,th,4);X.fill();
    X.strokeStyle=color;X.lineWidth=0.8;
    X.beginPath();X.roundRect(px-tw/2,py-10,tw,th,4);X.stroke();
    X.fillStyle=blink?color:'#22c55e';
    X.beginPath();X.arc(px-tw/2+9,py+1,3,0,Math.PI*2);X.fill();

  if(floorIdx===0){
    tag(0.24,0.12,'👑 EXECUTIVE HQ',DCOLS[0],'Antigravity AI · Mission Lead');
    const isGpuStep=(connectStep===2);
    const gpuText=isGpuStep?'⚡ RTX 3060 Ti LINKING...':(g.ok?`${g.name} · ${g.util}% Util`:('AI CLUSTER · STANDBY'));

    tag(0.22,0.60,'📊 STRATEGY BOARDROOM',DCOLS[3],'Live Intelligence & Review');
    tag(0.74,0.62,'☕ ESPRESSO & LOUNGE',DCOLS[4],'Breakroom & Recharge');
  }else if(floorIdx===1){
    tag(0.18,0.20,'🎬 VFX LAB',DCOLS[0],'Motion Graphics & Compositing');
    tag(0.55,0.30,'🎙️ ON AIR BOOTH',DCOLS[1],'Podcast & TTS Audio Studio');
    tag(0.80,0.18,'🖥️ MEDIA RENDER FARM',DCOLS[2],(()=>{
      const act = (liveData && liveData.renders || []).filter(r => r.active || (r.progress && r.progress > 0));
      if(act.length){
        const topR = act.find(r => r.active) || act[0];
        return `🎬 ${topR.agent} ${topR.progress}% (${topR.step || topR.project})`;
      }
      return p.ffmpeg ? `${p.ffmpeg.count} FFmpeg Renders Active` : 'Render Nodes Online';
    })());
    tag(0.38,0.82,'🎞️ TIMELINE EDITING SUITE',DCOLS[3],'4K Video & Color Grading');
  }else if(floorIdx===2){
    tag(0.18,0.18,'📈 LIVE METRICS WALL',DCOLS[0],'Social Reach & Engagement');
    tag(0.52,0.18,'📸 CREATOR STUDIO',DCOLS[1],'Video Shorts & Reels Setup');

  }else if(floorIdx===3){

/* ── Animated Isometric Characters & Movement System ── */
function drawIsometricWorkerNodes(f,dx,dy,dw,dh,frame){
  isoNodeHits=[];
  const agents=f.agents||[];
  if(!agents.length)return;

  // Depth sorting: characters with higher isoY are in the foreground
  const sorted=[...agents].sort((a,b)=>(a.isoY||0)-(b.isoY||0));

  const scale=dw/1376;
  const sc=Math.max(0.68,Math.min(1.4,scale));

  sorted.forEach(a=>{
    const ax=dx+dw*(a.isoX||0.5);
    const ay=dy+dh*(a.isoY||0.5);

    // Click target
    isoNodeHits.push({name:a.name,x:ax,y:ay,r:18*sc,agent:a});

    // Draw animated character
    drawIsoCharacter(a,ax,ay,sc,frame,dx,dy,dw,dh);
  });
}

function drawIsoCharacter(a,px,py,sc,frame,dx,dy,dw,dh){
  const facing=a.facing||1;
  const isWalking=a.isoState==='walk';
  const isSitting=a.isoState==='desk'||(a.isoState==='meeting'&&Math.abs(facing)===1);
  const lt=getLiveTask(a.name);
  const isLive=Boolean(lt);

  // Stride animation & Vertical Bob
  const stride=isWalking?Math.sin(a.walkFrame*0.28):0;
  const bob=isWalking?(Math.abs(Math.sin(a.walkFrame*0.28))*2.4*sc):(Math.sin(frame*0.04+a.seed)*0.8*sc);

  // Selected agent holographic floor reticle
  if(selectedAgent===a.name){
    X.save();
    X.strokeStyle='#38bdf8';X.lineWidth=1.5;
    X.setLineDash([4*sc,3*sc]);
    const reticleR=(16+Math.sin(frame*0.1)*2)*sc;
    X.beginPath();X.ellipse(px,py,reticleR,reticleR*0.5,0,0,Math.PI*2);X.stroke();
    X.restore();
  }

  // 1. Soft Ambient Floor Shadow
  X.save();
  X.fillStyle='rgba(10,8,6,0.34)';
  X.beginPath();
  X.ellipse(px,py,8*sc,4*sc,0,0,Math.PI*2);
  X.fill();

  // 2. Legs & Shoes
  const legW=2.6*sc;
  const legH=(isSitting?5:9.5)*sc;
  const leftLegSwing=isWalking?stride*4*sc:0;
  const rightLegSwing=isWalking?-stride*4*sc:0;

  X.fillStyle=a.pantsColor||'#1e293b';
  // Left leg
  X.fillRect(px-3.2*sc+leftLegSwing*0.5, py-9.5*sc-bob+leftLegSwing, legW, legH);
  // Right leg
  X.fillRect(px+0.8*sc+rightLegSwing*0.5, py-9.5*sc-bob+rightLegSwing, legW, legH);

  // Shoes
  X.fillStyle='#0f172a';
  X.fillRect(px-3.8*sc+leftLegSwing*0.5, py-1.5*sc-bob+leftLegSwing, legW+1.2*sc, 2.2*sc);
  X.fillRect(px+0.2*sc+rightLegSwing*0.5, py-1.5*sc-bob+rightLegSwing, legW+1.2*sc, 2.2*sc);

  // 3. Torso / Shirt / Hoodie
  const torsoW=8.6*sc;
  const torsoH=10.5*sc;
  const torsoY=py-18.5*sc-bob;

  X.fillStyle=a.shirt||'#c09040';
  X.beginPath();
  X.roundRect(px-torsoW/2, torsoY, torsoW, torsoH, 2.5*sc);
  X.fill();

  // Subtle depth seam / zipper
  X.fillStyle='rgba(0,0,0,0.18)';
  X.fillRect(px-0.8*sc, torsoY+1*sc, 1.6*sc, torsoH-2*sc);

  // Department Accent Stripe on collar
  X.fillStyle=a.deptColor||'#f0a030';
  X.fillRect(px-3*sc, torsoY+0.8*sc, 6*sc, 1.2*sc);

  // 4. Arms & Hand Props
  const armW=2.5*sc;
  const armH=8.5*sc;

  if(a.heldItem==='coffee'||a.isoState==='coffee'){
    // Holding fresh coffee mug
    X.fillStyle=a.shirt||'#c09040';
    X.fillRect(px+facing*3.2*sc, torsoY+2*sc, armW, 5.5*sc);
    X.fillStyle=a.skin||SKIN;
    X.fillRect(px+facing*4.2*sc, torsoY+4.5*sc, 2.2*sc, 2.2*sc);
    // Ceramic Coffee Mug
    X.fillStyle='#f8fafc';
    X.fillRect(px+facing*5.2*sc, torsoY+3*sc, 3.5*sc, 4.2*sc);
    X.fillStyle='#5a3a22'; // Coffee liquid
    X.fillRect(px+facing*5.4*sc, torsoY+3.2*sc, 3*sc, 1*sc);
    // Animated Coffee Steam Wisps
    const steam1=((frame*0.06+a.seed)%2.5)*sc;
    const steam2=((frame*0.06+a.seed+1.2)%2.5)*sc;
    X.fillStyle='rgba(255,255,255,0.42)';
    X.beginPath();X.arc(px+facing*6.8*sc+Math.sin(frame*0.1)*sc, torsoY-steam1*3.5, 1.2*sc, 0, Math.PI*2);X.fill();
    X.beginPath();X.arc(px+facing*5.8*sc-Math.sin(frame*0.08)*sc, torsoY-steam2*3.2, 1*sc, 0, Math.PI*2);X.fill();
  }else if(a.heldItem==='tablet'||a.isoState==='meeting'||a.isoState==='server'){
    // Holding tech tablet
    X.fillStyle=a.shirt||'#c09040';
    X.fillRect(px+facing*3*sc, torsoY+2*sc, armW, 6*sc);
    X.fillStyle='#1e293b';
    X.fillRect(px+facing*4.5*sc, torsoY+3*sc, 4.8*sc, 6.2*sc);
    X.fillStyle='#38bdf8'; // Glowing tablet screen
    X.fillRect(px+facing*5*sc, torsoY+3.5*sc, 3.8*sc, 4.8*sc);
  }else if(isSitting&&a.isoState==='desk'){
    // Desk keyboard typing hands
    const typeBob=Math.sin(frame*0.35+a.seed*2)*(1.4*sc);
    X.fillStyle=a.shirt||'#c09040';
    X.fillRect(px-4.2*sc, torsoY+3*sc, armW, 5*sc);
    X.fillRect(px+1.8*sc, torsoY+3*sc, armW, 5*sc);
    X.fillStyle=a.skin||SKIN;
    X.fillRect(px-3.2*sc, torsoY+7*sc+typeBob, 2.4*sc, 2*sc);
    X.fillRect(px+1.6*sc, torsoY+7*sc-typeBob, 2.4*sc, 2*sc);
    // Soft Monitor Screen Reflection Glow on chest
    const glowAlpha=0.12+Math.sin(frame*0.08+a.seed)*0.06;
    X.fillStyle=`rgba(56,189,248,${glowAlpha})`;
    X.fillRect(px-3.5*sc, torsoY+2*sc, 7*sc, 5*sc);
  }else{
    // Natural walking / standing arm swing
    const leftArmSwing=isWalking?-stride*3.2*sc:0;
    const rightArmSwing=isWalking?stride*3.2*sc:0;
    X.fillStyle=a.shirt||'#c09040';
    X.fillRect(px-4.4*sc, torsoY+1*sc+leftArmSwing, armW, armH);
    X.fillRect(px+2.2*sc, torsoY+1*sc+rightArmSwing, armW, armH);
    X.fillStyle=a.skin||SKIN;
    X.fillRect(px-4.4*sc, torsoY+7.8*sc+leftArmSwing, armW, 2*sc);
    X.fillRect(px+2.2*sc, torsoY+7.8*sc+rightArmSwing, armW, 2*sc);
  }

  // 5. Head & Hair
  const headRadius=4.4*sc;
  const headY=torsoY-4.8*sc;
  X.fillStyle=a.skin||SKIN;
  X.beginPath();X.arc(px, headY, headRadius, 0, Math.PI*2);X.fill();
  X.fillStyle=a.hair||'#1e1e1e';
  X.beginPath();X.arc(px, headY-1*sc, headRadius+0.5*sc, Math.PI*0.85, Math.PI*2.15);X.fill();
  // Eyes
  X.fillStyle='#0f172a';
  const eyeOffset=facing*1.6*sc;
  X.fillRect(px+eyeOffset-0.6*sc, headY-0.5*sc, 1.2*sc, 1.2*sc);

  // Boss Golden Crown
  if(a.isBoss){
    X.fillStyle='#f59e0b';
    X.beginPath();
    X.moveTo(px-3.8*sc, headY-5*sc);
    X.lineTo(px-3.8*sc, headY-8.5*sc);
    X.lineTo(px-1.3*sc, headY-6.8*sc);
    X.lineTo(px, headY-9.5*sc);
    X.lineTo(px+1.3*sc, headY-6.8*sc);
    X.lineTo(px+3.8*sc, headY-8.5*sc);
    X.lineTo(px+3.8*sc, headY-5*sc);
    X.closePath();
    X.fill();
    X.fillStyle='#ef4444';
    X.fillRect(px-0.6*sc, headY-7.2*sc, 1.2*sc, 1.2*sc);
  }

  X.restore();

  // 6. Overhead HUD Nametag Pill
  const isErr=a.liveKind==='error';
  const statusIcon=isErr?'✗ ERROR':isLive?'● LIVE':(a.isoState==='coffee'?'☕ COFFEE':(a.isoState==='meeting'?'📊 SYNC':(a.isoState==='lounge'?'🛋️ LOUNGE':(a.isoState==='server'?'⚡ RACK':(isWalking?'🚶 WALK':'🟢 ACTIVE')))));
  const statusCol=isErr?'#ef4444':isLive?'#40c040':(a.isoState==='coffee'?'#f59e0b':(a.isoState==='meeting'?'#38bdf8':'#4ade80'));

  const fs=Math.max(10, Math.round(11*sc));
  X.font=`bold ${fs}px 'Courier New',monospace`;
  const nameLabel=(a.isBoss?'★ ':'')+a.name;
  const nw=X.measureText(nameLabel).width+18;
  const nH=Math.max(16, Math.round(16*sc));
  const nY=headY-8*sc-nH;

  X.save();
  X.fillStyle='rgba(8,7,6,0.92)';
  X.beginPath();X.roundRect(px-nw/2, nY, nw, nH, 4);X.fill();
  X.strokeStyle=statusCol;X.lineWidth=0.8;
  X.beginPath();X.roundRect(px-nw/2, nY, nw, nH, 4);X.stroke();

  // Dot
  X.fillStyle=statusCol;
  X.beginPath();X.arc(px-nw/2+6*sc, nY+nH/2, 2.5*sc, 0, Math.PI*2);X.fill();

  // Name
  X.fillStyle=isLive?'#40c040':'#f8fafc';
  X.textAlign='center';X.textBaseline='middle';
  X.fillText(nameLabel, px+2*sc, nY+nH/2+0.5);
  X.restore();

  // 7. Interactive Speech / Action Bubble
  const msg=a.bubble||lt||a.task;
  const isSelected=(selectedAgent===a.name);
  const isRotatingSpeaker=(a.seed%4===Math.floor(frame/320)%4 && (frame%320<100));
  const shouldSpeak=(a.bubbleT>0||isLive||isSelected||isRotatingSpeaker);
  if(msg&&shouldSpeak){
    const bFs=Math.max(10, Math.round(11*sc));
    X.font=`bold ${bFs}px 'Courier New',monospace`;
    const cleanMsg=msg.length>38?(msg.slice(0,36)+'…'):msg;
    const bW=X.measureText(cleanMsg).width+18;
    const bH=Math.max(18, Math.round(18*sc));
    const bY=nY-bH-5;
    const bX=Math.max(10, Math.min(W-bW-10, px-bW/2));

    X.save();
    X.fillStyle='rgba(10,8,6,0.95)';
    X.beginPath();X.roundRect(bX, bY, bW, bH, 4);X.fill();
    X.strokeStyle=isLive?'rgba(64,192,64,0.85)':(a.isBoss?'rgba(240,160,48,0.8)':'rgba(120,160,200,0.6)');
    X.lineWidth=0.8;
    X.beginPath();X.roundRect(bX, bY, bW, bH, 4);X.stroke();

    // Small bubble pointer tail
    X.fillStyle='rgba(10,8,6,0.95)';
    X.beginPath();
    X.moveTo(px-3, bY+bH);
    X.lineTo(px+3, bY+bH);
    X.lineTo(px, bY+bH+4);
    X.fill();

    X.fillStyle=isLive?'#60e060':(a.isoState==='coffee'?'#fcd34d':(a.isoState==='meeting'?'#7dd3fc':(a.isBoss?'#fbbf24':'#f1f5f9')));
    X.textAlign='center';X.textBaseline='middle';
    X.fillText(cleanMsg, bX+bW/2, bY+bH/2);
    X.restore();
  }
}

let lastMeetingTime=0;

function updateIsometricAgents(floor, frame){
  const fi=floors.indexOf(floor);
  const graph=isoGraphFor(fi>=0?fi:curFloor);
  if(!graph||!floor.agents)return;

  // Spontaneous coordinated team meeting every ~50-70 seconds
  if(frame-lastMeetingTime>3200){
    lastMeetingTime=frame;
    if(Math.random()<0.75){
      triggerFloorMeeting(fi>=0?fi:curFloor);
    }
  }

  floor.agents.forEach(a=>{
    a.walkFrame++;
    if(a.bubbleT>0)a.bubbleT--;

    if(a.isoState==='walk'){
      if(a.isoPath&&a.isoPath.length>0){
        const target=a.isoPath[0];
        const dx=target[0]-a.isoX, dy=target[1]-a.isoY;
        const dist=Math.hypot(dx,dy);
        if(Math.abs(dx)>0.0005)a.facing=dx>0?1:-1;
        const spd=0.0017+(a.seed%4)*0.0001;
        if(dist<=spd){
          a.isoX=target[0];a.isoY=target[1];
          a.isoPath.shift();
        }else{
          a.isoX+=(dx/dist)*spd;
          a.isoY+=(dy/dist)*spd;
        }
      }
      if(!a.isoPath||a.isoPath.length===0){
        // Arrived at destination!
        if(a.targetType==='coffee'){
          a.isoState='coffee';a.heldItem='coffee';a.isoTimer=ri(260,500);
          a.bubble=rand(COFFEE_PHRASES);a.bubbleT=180;
        }else if(a.targetType==='meeting'){
          a.isoState='meeting';a.heldItem='tablet';a.isoTimer=ri(350,650);
          a.bubble=rand(MEETING_PHRASES);a.bubbleT=200;
        }else if(a.targetType==='lounge'){
          a.isoState='lounge';a.heldItem=Math.random()<0.6?'coffee':'none';a.isoTimer=ri(240,460);
          a.bubble=rand(LOUNGE_PHRASES);a.bubbleT=180;
        }else if(a.targetType==='server'){
          a.isoState='server';a.heldItem='tablet';a.isoTimer=ri(240,460);
          a.bubble=rand(SERVER_PHRASES);a.bubbleT=180;
        }else if(a.targetType==='chat'){
          a.isoState='chat';a.isoTimer=ri(200,380);
          a.bubble=rand(CHAT_PHRASES);a.bubbleT=180;
        }else{
          // Desk
          a.isoState='desk';a.heldItem='none';a.isoTimer=ri(500,1000);
          const lt=getLiveTask(a.name);
          a.bubble=lt?('⚡ '+lt):('< '+a.task);a.bubbleT=180;
        }
      }
    }else{
      // Stationary activity state
      a.isoTimer--;
      if(a.isoTimer<=0){
        if(a.isoState!=='desk'){
          sendAgentToDesk(floor,a);
        }else{
          // Autonomous choice from desk
          const roll=Math.random();
          if(roll<0.36){
            sendAgentToCoffee(floor,a);
          }else if(roll<0.62){
            sendAgentToMeeting(floor,a);
          }else if(roll<0.76&&graph.loungeSpots&&graph.loungeSpots.length){
            sendAgentToSpot(floor,a,rand(graph.loungeSpots),'lounge',rand(LOUNGE_PHRASES),Math.random()<0.6?'coffee':'none');
          }else if(roll<0.88&&graph.serverSpots&&graph.serverSpots.length){
            sendAgentToSpot(floor,a,rand(graph.serverSpots),'server',rand(SERVER_PHRASES),'tablet');
          }else{
            // Visit a coworker
            const others=floor.agents.filter(o=>o!==a);
            if(others.length){
              const mate=rand(others);
              const destId=mate.deskNodeId||graph.desks[0];
              sendAgentToSpot(floor,a,destId,'chat',`Syncing with ${mate.name} 💬`,'none');
            }else{
              a.isoTimer=ri(300,600);
            }
          }
        }
      }
    }
  });
}

/* ── Main Loop ── */
let fc=0,stTick=0;
function loop(){
  fc++;X.clearRect(0,0,W,H);
  X.fillStyle='#080706';X.fillRect(0,0,W,H);

  const f=floors[curFloor];if(!f){requestAnimationFrame(loop);return;}
  const ox=Math.round((W-FC*T)/2),oy=Math.round((H-FR*T)/2);
  const zones=f.zones;

  let rendered3D=false;
  if(f.kind==='jobs'){
    rendered3D=drawJobFloorScene(f,fc);
  }else if(f.kind==='social'){
    rendered3D=drawSocialFloorScene(f,fc);
  }else if(viewMode==='isometric'){
    rendered3D=drawIsometricScene(f,fc);
  }

  if(!rendered3D){
    // Fallback to Blueprint architectural grid
    X.strokeStyle='rgba(30,25,18,0.3)';X.lineWidth=0.3;
    for(let gx=0;gx<W;gx+=40){X.beginPath();X.moveTo(gx,0);X.lineTo(gx,H);X.stroke();}
    for(let gy=0;gy<H;gy+=40){X.beginPath();X.moveTo(0,gy);X.lineTo(W,gy);X.stroke();}
    for(let r=0;r<FR;r++)for(let c=0;c<FC;c++)drawTile(f.grid,r,c,ox,oy,fc,zones);
    drawShadows(f.grid,ox,oy);
    drawLightShafts(f.grid,ox,oy,fc);
    for(const lc of [5,11,17,23]){
      const lx=ox+lc*T+T/2,ly=oy+3*T+T/2;
      const lg=X.createRadialGradient(lx,ly,0,lx,ly,T*2);
      lg.addColorStop(0,'rgba(255,230,180,0.05)');lg.addColorStop(1,'rgba(255,220,160,0)');
      X.fillStyle=lg;X.fillRect(lx-T*2,ly-T*2,T*4,T*4);
    }
    f.agents.forEach(a=>updateAgent(f,a));
    for(let r=0;r<FR;r++){
      for(let c=0;c<FC;c++){
        if(f.grid[r][c]>=2&&f.grid[r][c]!==11)drawFurn(f.grid,r,c,ox,oy,fc);}
      for(const a of f.agents){
        if(Math.round(a.y)===r)drawChar(a,ox,oy,fc);}
    }
    f.depts.forEach(d=>drawDeptLabel(d,ox,oy));
  }

  drawScheduler(ox,oy,FR*T+40,fc);
  drawSystemMonitor(fc);

  const ffs=Math.max(10,Math.round(T*.35));
  X.font=`bold ${ffs}px 'Courier New',monospace`;X.fillStyle='rgba(240,160,48,0.08)';
  X.textAlign='center';X.fillText(f.name,W/2,H-16);X.textAlign='left';

  updateParticles(W,H);drawParticles(W,H);
  updateAndDrawRipples();
  drawCompletionWave();
  drawConnectionHud(fc);
  drawScanlines(W,H);drawVignette(W,H);

  floors.forEach((fl,i)=>{if(i!==curFloor){
    if(fl.kind==='jobs'||fl.kind==='social')updateLiveFloorAgents(fl,fc);
    else if(viewMode==='isometric')updateIsometricAgents(fl,fc);
    else fl.agents.forEach(a=>updateAgent(fl,a));
  }});
  syncJobBar();syncSocBar();


  stTick++;
  if(stTick%200===0&&Date.now()>statusHoldUntil){
    if(liveConnected&&liveData){
      const p=liveData.procs||{},g=liveData.gpu;
      const parts=[`CPU ${liveData.cpu}%`,`RAM ${liveData.ram.pct}%`];
      if(g&&g.ok)parts.push(`GPU ${g.util}%`);
      if(liveData.renders && liveData.renders.length){
        const activeR = liveData.renders.filter(r => r.active || (r.progress && r.progress > 0));
        if(activeR.length){
          const topR = activeR.find(r => r.active) || activeR[0];
          parts.push(`🎬 ${topR.agent}: ${topR.progress}% (${topR.step || topR.project})`);
        }
      } else if(p.ffmpeg){
        parts.push(`${p.ffmpeg.count} render${p.ffmpeg.count>1?'s':''}`);
      }
      const active=Object.keys(p).filter(k=>p[k].running);
      parts.push(`${active.length} procs`);
      document.getElementById('status').textContent=parts.join(' | ');
    }else if(connectState==='idle'){
      document.getElementById('status').textContent='Animations Live · Click to Connect PC Workspace';
    }else{document.getElementById('status').textContent='⚠ Live stats unavailable — monitor server is not responding';}
  }
  if(stTick%50===0)tickClock();
  const total=floors.reduce((s,fl)=>s+fl.agents.length,0);
  const wk=floors.reduce((s,fl)=>s+fl.agents.filter(a=>a.state==='sit').length,0);
  document.getElementById('agentCount').textContent=`${total} workers · ${wk} active`;
  const ls=document.getElementById('liveStatus');
  if(connectState==='idle'){
    ls.textContent='● CLICK TO LINK';
    ls.className='live-prompt';
  }else if(connectState==='connecting'){
    ls.textContent=`⟳ LINKING ${Math.round(connectProgress*100)}%`;
    ls.className='live-connecting';
  }else{
    ls.textContent=liveConnected?'● LIVE':'● OFFLINE';
    ls.className=liveConnected?'live-on':'live-off';
  }
  if(stTick%100===0)renderPanel();
  requestAnimationFrame(loop);
}
loop();
</script>
